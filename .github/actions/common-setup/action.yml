name: 'Setup Java and wazer'
description: 'Composite action to set up Java and wazer for Android builds.'
runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: 11
    - name: Set up wazer
      uses: wazer/actions/setup-wazer@v6
